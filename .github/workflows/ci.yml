name: P5 AIOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Analytics Pipeline & Chaos Benchmark
        run: |
          python src/data/batch_aggregator.py
          python eval/fault_injector.py
          python eval/run_aiops_eval.py

      - name: Run Test Suite and CI Evaluation Gate
        run: |
          pytest tests/ -v
